openapi: 3.0.3
info:
    title: Governify Join API
    version: 1.0.0
    description: Resumable provider-driven onboarding for Governify projects.
servers:
    - url: /api/v1
components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    schemas:
        StandardResponse:
            type: object
            properties:
                success: { type: boolean }
                message: { type: string }
                httpStatus: { type: integer }
                appCode: { type: string }
                data: {}
paths:
    /health:
        get:
            servers: [{ url: / }]
            summary: Liveness check
            responses:
                '200': { description: Process is alive }
    /ready:
        get:
            servers: [{ url: / }]
            summary: Readiness check
            responses:
                '200': { description: MongoDB is connected }
                '503': { description: MongoDB is not connected }
    /agreement-templates:
        get:
            summary: List Registry-backed agreement options
            security: [{ BearerAuth: [] }]
            responses:
                '200': { description: Four-metric CS169L GitHub proof-of-concept agreement }
    /onboardings:
        post:
            summary: Create an onboarding session
            security: [{ BearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [provider, agreementTemplateId]
                            properties:
                                provider: { type: string, enum: [github] }
                                agreementTemplateId: { type: string }
            responses:
                '201': { description: Onboarding created }
    /onboardings/{id}:
        parameters:
            - in: path
              name: id
              required: true
              schema: { type: string }
        get:
            summary: Get an owned onboarding session
            security: [{ BearerAuth: [] }]
            responses:
                '200': { description: Current session state }
    /onboardings/{id}/integrations/github/authorize:
        parameters:
            - in: path
              name: id
              required: true
              schema: { type: string }
        post:
            summary: Create a signed GitHub App installation URL
            security: [{ BearerAuth: [] }]
            responses:
                '200': { description: Authorization URL }
    /integrations/github/callback:
        get:
            summary: Complete and verify GitHub App installation
            parameters:
                - { in: query, name: state, required: true, schema: { type: string } }
                - { in: query, name: installation_id, required: true, schema: { type: integer } }
                - { in: query, name: code, required: true, schema: { type: string } }
            responses:
                '303': { description: Redirect to the join frontend }
    /onboardings/{id}/repositories:
        get:
            summary: List installation repositories
            security: [{ BearerAuth: [] }]
            parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
            responses: { '200': { description: Repositories } }
    /onboardings/{id}/projects:
        get:
            summary: List Projects V2 boards and status fields
            security: [{ BearerAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
                - { in: query, name: owner, required: true, schema: { type: string } }
            responses: { '200': { description: Projects } }
    /onboardings/{id}/collaborators:
        get:
            summary: List repository collaborators
            security: [{ BearerAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
                - { in: query, name: owner, required: true, schema: { type: string } }
                - { in: query, name: repo, required: true, schema: { type: string } }
            responses: { '200': { description: Collaborators } }
    /onboardings/{id}/organizations:
        get:
            summary: List the user's Governify organizations
            security: [{ BearerAuth: [] }]
            parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
            responses: { '200': { description: Organizations } }
    /onboardings/{id}/configuration:
        put:
            summary: Validate and save guided onboarding configuration
            security: [{ BearerAuth: [] }]
            parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
            responses: { '200': { description: Configuration saved } }
    /onboardings/{id}/provision:
        post:
            summary: Queue asynchronous provisioning
            security: [{ BearerAuth: [] }]
            parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
            responses: { '202': { description: Provisioning queued } }
    /onboardings/{id}/retry:
        post:
            summary: Retry provisioning from its last checkpoint
            security: [{ BearerAuth: [] }]
            parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
            responses: { '202': { description: Retry queued } }
    /internal/integrations/github/installations/{installationId}/token:
        get:
            summary: Mint a short-lived token for a joined GitHub App installation
            security: [{ BearerAuth: [] }]
            parameters:
                - { in: path, name: installationId, required: true, schema: { type: integer } }
            responses:
                '200': { description: Short-lived GitHub installation token }
                '401': { description: Service authentication required }
