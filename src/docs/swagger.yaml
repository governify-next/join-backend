openapi: 3.0.3
info:
    title: Governify Join API
    version: 1.4.0
    description: Declarative, resumable onboarding using Registry's public template catalog and real ecosystem provisioning.
servers:
    - url: /api/v1
components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    schemas:
        StandardResponse:
            type: object
            properties:
                success: { type: boolean }
                message: { type: string }
                httpStatus: { type: integer }
                appCode: { type: string }
                data: {}
paths:
    /health:
        get:
            servers: [{ url: / }]
            summary: Liveness check
            responses:
                '200': { description: Process is alive }
    /ready:
        get:
            servers: [{ url: / }]
            summary: Readiness check
            responses:
                '200': { description: MongoDB is connected }
                '503': { description: MongoDB is not connected }
    /agreement-templates:
        get:
            summary: List supported public Registry Agreement Templates and their onboarding definitions
            security: [{ BearerAuth: [] }]
            responses:
                '200':
                    description: Registry templates matched with Join modules, requirements and declarative mappings
    /onboardings:
        post:
            summary: Create an onboarding session
            security: [{ BearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [agreementTemplateId]
                            properties:
                                agreementTemplateId: { type: string }
            responses:
                '201':
                    description: Onboarding created from the selected template and definition
    /onboardings/{id}:
        parameters:
            - in: path
              name: id
              required: true
              schema: { type: string }
        get:
            summary: Get an owned onboarding session
            security: [{ BearerAuth: [] }]
            responses:
                '200': { description: Current session state }
    /onboardings/{id}/integrations/{provider}/connect:
        parameters:
            - in: path
              name: id
              required: true
              schema: { type: string }
            - in: path
              name: provider
              required: true
              schema: { type: string, enum: [github, zenhub] }
        post:
            summary: Connect a required integration
            description: Starts GitHub OAuth-first installation discovery or immediately connects the mocked ZenHub adapter.
            security: [{ BearerAuth: [] }]
            responses:
                '200': { description: Authorization URL }
    /integrations/github/callback:
        get:
            summary: Discover or complete a GitHub App installation
            description: Existing installations return to Join immediately. If none are accessible, Join redirects through GitHub installation and verifies the result through OAuth.
            parameters:
                - { in: query, name: state, required: true, schema: { type: string } }
                - { in: query, name: installation_id, required: false, schema: { type: integer } }
                - { in: query, name: code, required: true, schema: { type: string } }
            responses:
                '303': { description: Redirect to the join frontend }
    /onboardings/{id}/requirements/{requirementId}/options:
        post:
            summary: Resolve options for one declarative requirement
            description: Dispatches to the allow-listed GitHub, ZenHub mock, Scope Manager or static adapter operation.
            security: [{ BearerAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string } }
                - { in: path, name: requirementId, required: true, schema: { type: string } }
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                answers: { type: object, additionalProperties: true }
            responses: { '200': { description: Display-safe resource options } }
    /onboardings/{id}/configuration:
        put:
            summary: Validate and save guided onboarding configuration
            security: [{ BearerAuth: [] }]
            parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [answers]
                            properties:
                                answers: { type: object, additionalProperties: true }
            responses: { '200': { description: Declarative answers validated and saved } }
    /onboardings/{id}/answers:
        patch:
            summary: Save partial wizard answers for resumption
            security: [{ BearerAuth: [] }]
            parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [answers]
                            properties:
                                answers: { type: object, additionalProperties: true }
            responses: { '200': { description: Partial answers saved } }
    /onboardings/{id}/provision:
        post:
            summary: Queue asynchronous ecosystem provisioning
            description: Reuses Registry Guarantee Templates; creates or reuses the organization's Agreement Template, Scope, Agreement collection and version; and supplies one initial GitHub installation token with its installation ID and expiration. Join then starts state generation and schedules hourly calculations; Fetcher owns later token renewal.
            security: [{ BearerAuth: [] }]
            parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
            responses: { '202': { description: Provisioning queued } }
    /onboardings/{id}/retry:
        post:
            summary: Retry provisioning from its last checkpoint
            security: [{ BearerAuth: [] }]
            parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
            responses: { '202': { description: Retry queued } }
